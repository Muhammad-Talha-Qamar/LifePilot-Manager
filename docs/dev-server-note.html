<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LifePilot — use the Next.js app</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0c0a12;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #a78bfa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(139, 92, 246, 0.45), transparent 55%),
          radial-gradient(ellipse 50% 40% at 100% 20%, rgba(34, 211, 238, 0.25), transparent 50%),
          var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
        line-height: 1.5;
      }
      code {
        font-size: 0.9em;
        color: var(--accent);
      }
      a {
        color: var(--accent);
      }
      .status {
        margin-top: 1.25rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LifePilot runs on Next.js</h1>
      <p>
        Live Server opens this static file. The real app is served by
        <code>npm run dev</code> at
        <a id="app-link" href="http://localhost:3000">http://localhost:3000</a>.
      </p>
      <p class="status" id="status">Looking for the local server…</p>
    </main>
    <script>
      (function () {
        var ports = [3000, 3001, 3002];
        var status = document.getElementById("status");
        var link = document.getElementById("app-link");
        var i = 0;

        function tryNext() {
          if (i >= ports.length) {
            status.textContent =
              "No server found. In the project folder run: npm run dev";
            return;
          }
          var port = ports[i++];
          var base = "http://localhost:" + port;
          var controller = new AbortController();
          var timer = setTimeout(function () {
            controller.abort();
          }, 800);

          fetch(base + "/api/health", {
            signal: controller.signal,
            cache: "no-store",
          })
            .then(function (res) {
              clearTimeout(timer);
              if (!res.ok) throw new Error("bad");
              link.href = base;
              link.textContent = base;
              status.textContent = "Found app at " + base + " — redirecting…";
              location.replace(base + "/");
            })
            .catch(function () {
              clearTimeout(timer);
              tryNext();
            });
        }

        tryNext();
      })();
    </script>
  </body>
</html>
